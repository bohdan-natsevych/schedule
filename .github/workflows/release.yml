name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/client/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Build the frontend
        working-directory: frontend/client
        run: |
          npm ci
          npm run build

      - name: Work out the next version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release list --repo $env:GITHUB_REPOSITORY --limit 1 --json tagName --jq '.[0].tagName'
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $version = '1.0.2'
          } else {
            $parts = $tag.TrimStart('v').Split('.')
            $version = "$($parts[0]).$($parts[1]).$([int]$parts[2] + 1)"
          }
          Write-Host "Publishing $version (previous tag: '$tag')"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Stamp the version into the build
        run: python tools/stamp_version.py ${{ steps.version.outputs.version }}

      - name: Freeze the application
        run: pyinstaller --noconfirm schedule-manager.spec

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" `
            "Output\ScheduleManager-Setup.exe" `
            --repo $env:GITHUB_REPOSITORY `
            --title "v${{ steps.version.outputs.version }}" `
            --generate-notes
